version: 2.1
orbs:
  go: circleci/go@4.0.3
jobs:
  build-and-run-test:
    executor:
      name: go/default
      tag: "1.27"
    steps:
      - checkout
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - run:
          name: Run tests
          command: go test -v
  build-docker-image:
    docker:
      - image: cimg/go:1.27
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and push Docker image
          command: |
            docker build -t godemo1.azurecr.io/go-demo:latest .
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin godemo1.azurecr.io
            docker push godemo1.azurecr.io/go-demo:latest
workflows:
  test-and-deploy:
    jobs:
      - build-and-run-test
      - build-docker-image:
          requires:
            - build-and-run-test
